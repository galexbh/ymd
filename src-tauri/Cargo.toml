[package]
name = "ymd"
version = "0.10.0"
description = "A calm desktop front end for yt-dlp"
authors = ["galexbh"]
license = "MIT"
repository = "https://github.com/galexbh/ymd"
edition = "2021"
# Tauri 2 already needs 1.90; ymd itself uses `std::fs::File::lock` (1.89).
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "ymd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ymd"
path = "src/main.rs"

# Test-only stand-in for yt-dlp used by integration tests. Never bundled.
[[bin]]
name = "fake-ytdlp"
path = "tests/support/fake_ytdlp.rs"
required-features = ["test-support"]

[features]
default = []
test-support = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"
keyring = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
which = "8"
url = "=2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
log = "0.4"
# Local structured logs (JSON lines in <data dir>/logs). Nothing is sent anywhere.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
tracing-appender = "=0.2.5"
tracing-log = { version = "=0.2.0", default-features = false, features = ["std", "log-tracer"] }
chacha20poly1305 = "0.11"
getrandom = "0.3"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console"] }
winreg = "0.56"

[dev-dependencies]
base64 = "0.23"
insta = { version = "1", features = ["yaml", "json"] }
httpmock = "0.8"
tempfile = "3"
pretty_assertions = "1"
