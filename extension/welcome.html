<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ymd Cookies</title>
    <script type="module" src="./src/welcome.ts"></script>
  </head>
  <body>
    <main class="welcome">
      <header class="masthead">
        <svg
          class="isotype"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          shape-rendering="crispEdges"
          aria-hidden="true"
        >
          <g fill="currentColor">
            <rect x="1" y="1" width="22" height="2" />
            <rect x="1" y="3" width="2" height="20" />
            <rect x="21" y="3" width="2" height="20" />
            <rect x="3" y="21" width="5" height="2" />
            <rect x="15" y="21" width="6" height="2" />
            <rect x="4" y="4" width="16" height="1" />
            <rect x="4" y="5" width="1" height="14" />
            <rect x="19" y="5" width="1" height="14" />
            <rect x="4" y="19" width="4" height="1" />
            <rect x="15" y="19" width="5" height="1" />
            <rect x="7" y="7" width="3" height="3" />
            <rect x="8" y="10" width="3" height="3" />
            <rect x="9" y="13" width="3" height="3" />
            <rect x="14" y="7" width="3" height="3" />
            <rect x="13" y="10" width="3" height="3" />
            <rect x="12" y="13" width="3" height="3" />
            <rect x="11" y="16" width="3" height="3" />
            <rect x="10" y="19" width="3" height="3" />
            <rect x="9" y="22" width="3" height="2" />
          </g>
        </svg>
        <span class="masthead-name" data-i18n="appName">ymd Cookies</span>
      </header>

      <div class="welcome-intro">
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" data-i18n="welcomeLead"></p>
      </div>

      <ol class="steps">
        <li id="step-pin" class="step" data-done="false">
          <span class="step-mark" aria-hidden="true"
            ><span class="step-number">1</span
            ><svg
              class="icon step-check"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          <div class="step-body">
            <h2 class="step-head" data-i18n="welcomePinHeading"></h2>
            <p data-i18n="welcomePinBody"></p>

            <!-- The browser toolbar, drawn: the puzzle piece opens the list, the pin keeps it. -->
            <div class="mock" aria-hidden="true">
              <div class="mock-bar">
                <span class="mock-address"></span>
                <span class="mock-button is-target">
                  <svg
                    class="icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"
                    />
                  </svg>
                  <span class="mock-badge">1</span>
                </span>
              </div>
              <div class="mock-menu">
                <span class="mock-row">
                  <span class="mock-ext"></span>
                  <span class="mock-line"></span>
                </span>
                <span class="mock-row is-ours">
                  <svg
                    class="mock-isotype"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    shape-rendering="crispEdges"
                  >
                    <g fill="currentColor">
                      <rect x="1" y="1" width="22" height="2" />
                      <rect x="1" y="3" width="2" height="20" />
                      <rect x="21" y="3" width="2" height="20" />
                      <rect x="3" y="21" width="5" height="2" />
                      <rect x="15" y="21" width="6" height="2" />
                      <rect x="4" y="4" width="16" height="1" />
                      <rect x="4" y="5" width="1" height="14" />
                      <rect x="19" y="5" width="1" height="14" />
                      <rect x="4" y="19" width="4" height="1" />
                      <rect x="15" y="19" width="5" height="1" />
                      <rect x="7" y="7" width="3" height="3" />
                      <rect x="8" y="10" width="3" height="3" />
                      <rect x="9" y="13" width="3" height="3" />
                      <rect x="14" y="7" width="3" height="3" />
                      <rect x="13" y="10" width="3" height="3" />
                      <rect x="12" y="13" width="3" height="3" />
                      <rect x="11" y="16" width="3" height="3" />
                      <rect x="10" y="19" width="3" height="3" />
                      <rect x="9" y="22" width="3" height="2" />
                    </g>
                  </svg>
                  <span class="mock-name" data-i18n="appName">ymd Cookies</span>
                  <span class="mock-pin is-target">
                    <svg
                      class="icon"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      width="16"
                      height="16"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 17v5" />
                      <path
                        d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                      />
                    </svg>
                    <span class="mock-badge">2</span>
                  </span>
                </span>
                <span class="mock-row">
                  <span class="mock-ext"></span>
                  <span class="mock-line short"></span>
                </span>
              </div>
            </div>

            <p id="pin-state" class="field-note" role="status" hidden></p>
          </div>
        </li>

        <li id="step-sites" class="step" data-done="false">
          <span class="step-mark" aria-hidden="true"
            ><span class="step-number">2</span
            ><svg
              class="icon step-check"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          <div class="step-body">
            <h2 class="step-head" data-i18n="welcomeSitesHeading"></h2>
            <p data-i18n="welcomeSitesBody"></p>
            <p id="youtube-ready" class="ready" hidden>
              <svg
                class="icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <span data-i18n="welcomeYoutubeReady"></span>
            </p>
            <button id="use-youtube" class="button primary" type="button" hidden>
              <svg
                class="icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
              <span data-i18n="welcomeUseYoutube"></span>
            </button>
            <div id="other-sites" class="suggest" hidden>
              <p class="field-label" data-i18n="welcomeOthers"></p>
              <div id="other-list" class="chips"></div>
            </div>
            <p id="sites-result" class="field-note" role="status"></p>
          </div>
        </li>
      </ol>

      <p class="welcome-done" data-i18n="welcomeDone"></p>

      <footer class="privacy">
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <p data-i18n="privacyNote"></p>
      </footer>
    </main>
  </body>
</html>
