<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ymd Cookies</title>
    <script type="module" src="./src/popup.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header class="masthead">
        <svg
          class="isotype"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          shape-rendering="crispEdges"
          aria-hidden="true"
        >
          <g fill="currentColor">
            <rect x="1" y="1" width="22" height="2" />
            <rect x="1" y="3" width="2" height="20" />
            <rect x="21" y="3" width="2" height="20" />
            <rect x="3" y="21" width="5" height="2" />
            <rect x="15" y="21" width="6" height="2" />
            <rect x="4" y="4" width="16" height="1" />
            <rect x="4" y="5" width="1" height="14" />
            <rect x="19" y="5" width="1" height="14" />
            <rect x="4" y="19" width="4" height="1" />
            <rect x="15" y="19" width="5" height="1" />
            <rect x="7" y="7" width="3" height="3" />
            <rect x="8" y="10" width="3" height="3" />
            <rect x="9" y="13" width="3" height="3" />
            <rect x="14" y="7" width="3" height="3" />
            <rect x="13" y="10" width="3" height="3" />
            <rect x="12" y="13" width="3" height="3" />
            <rect x="11" y="16" width="3" height="3" />
            <rect x="10" y="19" width="3" height="3" />
            <rect x="9" y="22" width="3" height="2" />
          </g>
        </svg>
        <h1 data-i18n="appName">ymd Cookies</h1>
      </header>

      <section class="section" aria-labelledby="status-head">
        <h2 id="status-head" class="section-head" data-i18n="statusHeading"></h2>
        <div class="status-line">
          <span id="stamp" class="stamp" data-state="offline" role="status">
            <span class="visually-hidden" data-i18n="statusPrefix"></span>
            <span id="stamp-word" class="stamp-word"></span>
          </span>
          <dl class="facts">
            <div class="fact">
              <dt data-i18n="lastSyncLabel"></dt>
              <dd id="last-sync"></dd>
            </div>
            <div class="fact">
              <dt data-i18n="countLabel"></dt>
              <dd id="count" class="figure"></dd>
            </div>
          </dl>
        </div>

        <div id="notice" class="notice" hidden>
          <svg
            class="icon notice-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" x2="12" y1="8" y2="12" />
            <line x1="12" x2="12.01" y1="16" y2="16" />
          </svg>
          <div>
            <p id="notice-text" class="notice-text"></p>
            <p id="notice-hint" class="notice-hint"></p>
          </div>
        </div>

        <button id="send-now" class="button primary block" type="button">
          <svg
            class="icon spinner"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <svg
            class="icon icon-idle"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"
            />
            <path d="m21.854 2.147-10.94 10.939" />
          </svg>
          <span id="send-label" data-i18n="sendNow"></span>
        </button>
      </section>

      <section class="section" aria-labelledby="sites-head">
        <h2 id="sites-head" class="section-head" data-i18n="sitesHeading"></h2>
        <ul id="site-list" class="ledger"></ul>
        <p id="sites-empty" class="empty" data-i18n="sitesEmpty" hidden></p>

        <form id="add-form" class="add" novalidate>
          <label class="field-label" for="add-input" data-i18n="addLabel"></label>
          <div class="add-row">
            <input
              id="add-input"
              class="input"
              type="text"
              inputmode="url"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-describedby="add-error"
            />
            <button class="button secondary" type="submit">
              <svg
                class="icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
              <span data-i18n="addButton"></span>
            </button>
          </div>
          <p id="add-error" class="field-error" role="alert" hidden></p>
        </form>
      </section>

      <footer class="privacy">
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <p data-i18n="privacyNote"></p>
      </footer>
    </main>
  </body>
</html>
