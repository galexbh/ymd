version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @tauri-apps/* npm packages must stay on the same major.minor as the Rust crates
      # (tauri-cli refuses to build otherwise); bump them together with Cargo.lock by hand.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
