version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Mirror of the npm ignores below: a Tauri crate minor needs its @tauri-apps/* npm
      # package on the same major.minor (tauri-cli refuses to build otherwise); bump both by hand.
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tauri-plugin-*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @tauri-apps/* npm packages must stay on the same major.minor as the Rust crates
      # (tauri-cli refuses to build otherwise); bump them together with Cargo.lock by hand.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-minor"]
      # Types follow the Node major CI runs (24, the current LTS); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
