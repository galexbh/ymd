# Refreshes src/data/supported-sites.json from yt-dlp's supportedsites.md once a week and opens
# (or updates) a PR when the list changed. The list reaches users with ymd's next release.
name: Supported sites

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: supported-sites
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    name: refresh supported-sites.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the update branch
      pull-requests: write # open or update the PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The generator has no dependencies, so nothing is installed.
      - name: Regenerate the list
        run: node scripts/gen-supported-sites.mjs

      - name: Open or update the PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/supported-sites
          delete-branch: true
          add-paths: src/data/supported-sites.json
          commit-message: "Update yt-dlp supported sites list"
          title: "Update yt-dlp supported sites list"
          body: |
            Weekly refresh of `src/data/supported-sites.json` from yt-dlp's
            [supportedsites.md](https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md),
            generated by `scripts/gen-supported-sites.mjs`.

            CI checks the invariants (unique names, netrc keys in the keychain alphabet, count).
