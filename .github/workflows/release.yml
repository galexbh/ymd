# Builds installers for the three platforms on a version tag and attaches them to a DRAFT
# GitHub release (publish it by hand after a smoke test).
#
# macOS ships as ONE universal binary (universal-apple-darwin) rather than separate arm64/x64
# builds: users get a single .dmg that runs natively on Apple Silicon and Intel with no
# "which one do I download?" decision. The cost is ~2x macOS build time and a larger download,
# acceptable for a release-only workflow.
#
# Linux builds on ubuntu-22.04 so the AppImage/.deb link against an older glibc and run on
# more distributions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ""
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file

      - run: pnpm install --frozen-lockfile

      # The release body is this version's section of CHANGELOG.md.
      - name: Release notes
        id: notes
        run: |
          {
            echo "body<<YMD_NOTES_EOF"
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo "YMD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (minisign). Kept outside the repo as CI secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "ymd ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Signed updater artifacts + latest.json for tauri-plugin-updater. The app reads
          # releases/latest/download/latest.json, so a release must be published (not draft)
          # before installed copies see it.
          includeUpdaterJson: true

  # The ymd Cookies browser extension, zipped and attached to the same draft release. Runs after
  # the installers so tauri-action has already created the draft for this tag.
  extension:
    name: release (extension zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: release
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, build and zip
        run: |
          pnpm ext:test
          pnpm ext:build
          pnpm ext:zip

      - uses: actions/upload-artifact@v7
        with:
          name: ymd-cookies-extension
          path: extension/ymd-cookies-extension.zip
          if-no-files-found: error

      # gh resolves the draft release tauri-action created for this tag (no second draft).
      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" extension/ymd-cookies-extension.zip --clobber
