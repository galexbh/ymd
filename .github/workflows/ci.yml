# Gate for every change: nothing merges unless all jobs are green.
#
# Pull requests run the suites the change can affect (a docs-only PR runs only the format
# check); pushes to `main` always run everything. Rust coverage comes from the Linux cell of
# the rust job (cargo llvm-cov replaces cargo test there). Skipped jobs count as passing for
# branch protection.
name: CI

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
    branches: [main, "redesign/**"]
  workflow_dispatch:

# A new push to a PR cancels its previous run; pushes to main always finish, so every commit
# on main gets a result and saves its caches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Less debug info in test/dev builds: much faster linking (Windows above all), smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

defaults:
  run:
    shell: bash

jobs:
  # Which areas a change touches. Everything is "true" on main, manual runs and CI edits.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
      frontend: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.frontend == 'true' }}
      extension: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.extension == 'true' }}
      deps: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.deps == 'true' }}
      website: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.website == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - src-tauri/**
            frontend:
              - *ci
              - src/**
              - e2e/**
              - public/**
              - scripts/**
              - index.html
              - package.json
              - pnpm-lock.yaml
              - vite.config.ts
              - tsconfig*.json
              - eslint.config.js
              - playwright.config.ts
              - src-tauri/tauri.conf.json
              - src-tauri/capabilities/**
            extension:
              - *ci
              - extension/**
              # The provider list the popup shares with the app.
              - src/shared/**
              - src/styles/**
              - src/assets/brand/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              # The bridge contract pages hold the manifest key the extension tests read.
              - website/src/content/docs/**/puente-de-cookies.md
            deps:
              - *ci
              - package.json
              - pnpm-lock.yaml
              - extension/package.json
              - src-tauri/Cargo.toml
              - src-tauri/Cargo.lock
            website:
              - *ci
              - website/**
              - CHANGELOG.md
              - docs/assets/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  # Cheap and always on: formatting covers docs too (README, CHANGELOG…).
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  audit:
    name: dependency audit (npm + RustSec)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node v5 caches the pnpm store automatically; this job installs nothing.
          package-manager-cache: false

      - name: pnpm audit (fails on high or critical)
        run: pnpm audit --audit-level high

      # Prebuilt binary: seconds instead of compiling cargo-audit on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  frontend:
    name: frontend (lint, types, unit, e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Frontend coverage", "| metric | % | covered |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      # `pnpm build` would run tsc again; Typecheck above already did.
      - name: Production build
        run: pnpm exec vite build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E (mock backend)
        run: pnpm e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            coverage/
            playwright-report/
            test-results/
            e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14

  extension:
    name: extension (lint, unit, build, e2e)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + types
        run: pnpm ext:lint

      - name: Unit tests
        run: pnpm ext:test

      - name: Build
        run: pnpm ext:build

      - name: Zip
        run: pnpm ext:zip

      - uses: actions/upload-artifact@v7
        with:
          name: ymd-cookies-extension
          path: extension/ymd-cookies-extension.zip
          if-no-files-found: error
          retention-days: 30

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Real Chromium with the built extension and a fake native host.
      - name: E2E (extension + native messaging)
        run: pnpm ext:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-report
          path: |
            playwright-report/extension/
            test-results/extension/
          if-no-files-found: ignore
          retention-days: 14

  # The documentation site builds and its internal links resolve (starlight-links-validator).
  # Deploying is docs.yml's job, on main only.
  docs:
    name: docs (build, links)
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter ymd-website

      - name: Build + link check
        run: pnpm docs:build

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ runner.os == 'Linux' && 'rustfmt, clippy, llvm-tools-preview' || 'rustfmt, clippy' }}

      # PRs read main's cache but never overwrite it. On Linux it also holds cargo-llvm-cov's
      # instrumented build (target/llvm-cov-target, a nested target dir rust-cache keeps),
      # which the nightly smoke test reuses.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system dependencies (Tauri v2 prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # `tauri::generate_context!` needs `frontendDist` (../dist) to exist at compile time.
      - name: Frontend dist stub
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>ymd</title>' > dist/index.html

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features test-support -- -D warnings

      - name: cargo test
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --locked --features test-support

      # The same suite, instrumented: a gate exactly like cargo test, plus the coverage report
      # (no threshold). Replaces the separate coverage job that rebuilt everything on main.
      - name: cargo test + coverage (llvm-cov)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo llvm-cov --locked --features test-support --lcov --output-path lcov.info
          {
            echo '### Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: src-tauri/lcov.info
          retention-days: 14

  # The real app build (frontend + extension + Tauri), Linux only: the rust job already
  # compiles and tests the crate on every OS, and release.yml / warm-release-cache.yml build
  # the release binaries on all three. Own cache: without test-support and dev-dependencies
  # the feature set differs from the rust job's, so restoring that cache still recompiled
  # 60-127 crates.
  build-check:
    name: build-check (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file

      - run: pnpm install --frozen-lockfile

      # Compiles the app without installers. beforeBuildCommand is overridden to skip `tsc`
      # (the frontend job typechecks); vite and the extension build still run because the app
      # embeds dist/ and bundles extension/dist as a resource. `pnpm exec` hands the JSON to
      # the CLI as one argument (no script shell in between); `-- --locked` goes to cargo.
      - name: tauri build (no bundle)
        run: >-
          pnpm exec tauri build --debug --no-bundle
          --config '{"build":{"beforeBuildCommand":"pnpm exec vite build && pnpm ext:build"}}'
          -- --locked
