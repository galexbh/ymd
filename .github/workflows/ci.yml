# Gate for every change: nothing merges unless all jobs are green.
#
# Pull requests run the suites the change can affect (a docs-only PR runs only the format
# check); pushes to `main` always run everything, including the 3-OS app build and coverage.
# Skipped jobs count as passing for branch protection.
name: CI

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
    branches: [main, "redesign/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Less debug info in test/dev builds: much faster linking (Windows above all), smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

defaults:
  run:
    shell: bash

jobs:
  # Which areas a change touches. Everything is "true" on main, manual runs and CI edits.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      rust: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
      # What the commit itself touched, even on main (rust-coverage is skipped otherwise).
      rust-changed: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      frontend: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.frontend == 'true' }}
      extension: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.extension == 'true' }}
      deps: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.deps == 'true' }}
      website: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.website == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - src-tauri/**
            frontend:
              - *ci
              - src/**
              - e2e/**
              - public/**
              - scripts/**
              - index.html
              - package.json
              - pnpm-lock.yaml
              - vite.config.ts
              - tsconfig*.json
              - eslint.config.js
              - playwright.config.ts
              - src-tauri/tauri.conf.json
              - src-tauri/capabilities/**
            extension:
              - *ci
              - extension/**
              - src/styles/**
              - src/assets/brand/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              # The bridge contract pages hold the manifest key the extension tests read.
              - website/src/content/docs/**/puente-de-cookies.md
            deps:
              - *ci
              - package.json
              - pnpm-lock.yaml
              - extension/package.json
              - src-tauri/Cargo.toml
              - src-tauri/Cargo.lock
            website:
              - *ci
              - website/**
              - CHANGELOG.md
              - docs/assets/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  # Cheap and always on: formatting covers docs too (README, CHANGELOG…).
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  audit:
    name: dependency audit (npm + RustSec)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v5 caches the pnpm store automatically; this job installs nothing.
          package-manager-cache: false

      - name: pnpm audit (fails on high or critical)
        run: pnpm audit --audit-level high

      # Prebuilt binary: seconds instead of compiling cargo-audit on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  frontend:
    name: frontend (lint, types, unit, e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Frontend coverage", "| metric | % | covered |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Production build
        run: pnpm build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E (mock backend)
        run: pnpm e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            coverage/
            playwright-report/
            test-results/
            e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14

  extension:
    name: extension (lint, unit, build, e2e)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + types
        run: pnpm ext:lint

      - name: Unit tests
        run: pnpm ext:test

      - name: Build
        run: pnpm ext:build

      - name: Zip
        run: pnpm ext:zip

      - uses: actions/upload-artifact@v7
        with:
          name: ymd-cookies-extension
          path: extension/ymd-cookies-extension.zip
          if-no-files-found: error
          retention-days: 30

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Real Chromium with the built extension and a fake native host.
      - name: E2E (extension + native messaging)
        run: pnpm ext:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-report
          path: |
            playwright-report/extension/
            test-results/extension/
          if-no-files-found: ignore
          retention-days: 14

  # The documentation site builds and its internal links resolve (starlight-links-validator).
  # Deploying is docs.yml's job, on main only.
  docs:
    name: docs (build, links)
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter ymd-website

      - name: Build + link check
        run: pnpm docs:build

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # PRs read main's cache but never overwrite it. build-check restores this same cache
      # (shared-key), so each OS keeps one debug cache instead of two.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system dependencies (Tauri v2 prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file

      # `tauri::generate_context!` needs `frontendDist` (../dist) to exist at compile time.
      - name: Frontend dist stub
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>ymd</title>' > dist/index.html

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-support -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --features test-support

  # Instrumented rebuild: a report, not a gate. Only on main, and only when Rust changed (its
  # ~800 MB cache is the largest one; the repository's cache budget is 10 GB).
  rust-coverage:
    name: rust coverage (report)
    needs: [changes, rust]
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.rust-changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file
      - name: Frontend dist stub
        run: mkdir -p dist && echo '<!doctype html><title>ymd</title>' > dist/index.html
      - name: cargo llvm-cov
        working-directory: src-tauri
        run: |
          cargo llvm-cov --features test-support --lcov --output-path lcov.info
          {
            echo '### Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: src-tauri/lcov.info
          retention-days: 14

  # The real app build (frontend + extension + Tauri). All 3 OS on main; Linux on PRs that
  # touch the app (the rust job already compiles the crate on every OS).
  build-check:
    name: build-check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.extension == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["windows-latest","macos-latest","ubuntu-22.04"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the rust job's cache: same dependencies (test-support adds none), and saving a
      # second copy would only push other caches out of the 10 GB budget.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: debug
          save-if: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev pkg-config libssl-dev build-essential file

      - run: pnpm install --frozen-lockfile

      # Runs `beforeBuildCommand` (frontend + extension) then compiles the app; no installers.
      - name: tauri build (no bundle)
        run: pnpm tauri build --debug --no-bundle
